[package]
name = "secureagentsdesk"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "secureagentsdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# Estrazione testo per read_local_file: entrambe pure-Rust, senza
# dipendenze native (niente pkg-config, niente .dylib/.dll/.so bundlato) —
# scartate pdfium-render (wrapper nativo su PDFium) e lopdf da solo (troppo
# basso livello: qui serve testo, non manipolazione della struttura PDF).
pdf-extract = "0.12"
calamine = "0.36"
# Estrazione testo per read_local_file su .docx: pure-Rust anche questo,
# nessuna dipendenza nativa (stesso vincolo di pdf-extract/calamine sopra).
# Usato qui solo in lettura, ma il crate porta comunque anche l'API di
# scrittura: i test in fondo a questo file la usano per generare al volo
# un .docx valido, invece di incorporare un fixture binario come per
# PDF/XLSX.
docx-rs = "0.4"
# Per save_generated_binary_file: un valore Stringa JS non può portare byte
# binari arbitrari (es. un PDF esportato) sopra l'IPC di Tauri senza
# corrompersi, quindi il contenuto arriva già codificato in base64 e va
# decodificato prima di scrivere i byte grezzi su disco.
base64 = "0.23"

